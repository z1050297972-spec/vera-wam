<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#ffffff;}
  svg{display:block;}
  text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;}
</style>
</head>
<body>
<svg width="1800" height="1180" viewBox="0 0 1800 1180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="1180" fill="#ffffff"/>
  <text x="900" y="58" text-anchor="middle" font-size="34" font-weight="bold" fill="#111827">VERA 项目模块图</text>
  <text x="900" y="92" text-anchor="middle" font-size="17" fill="#6B7280">Turning Video Models into Generalist Robot Policies · 代码结构与依赖关系</text>

  <!-- layer labels (rotated) -->
  <text x="30" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#94A3B8" transform="rotate(-90 30 200)">入口层</text>
  <text x="30" y="400" text-anchor="middle" font-size="16" font-weight="bold" fill="#94A3B8" transform="rotate(-90 30 400)">策略层</text>
  <text x="30" y="590" text-anchor="middle" font-size="16" font-weight="bold" fill="#94A3B8" transform="rotate(-90 30 590)">模型层</text>
  <text x="30" y="805" text-anchor="middle" font-size="16" font-weight="bold" fill="#94A3B8" transform="rotate(-90 30 805)">数据 / 训练</text>
  <text x="30" y="1020" text-anchor="middle" font-size="16" font-weight="bold" fill="#94A3B8" transform="rotate(-90 30 1020)">部署 / 评测</text>

  <!-- ============ edges (drawn first, under boxes) ============ -->
  <g fill="none" stroke="#475569" stroke-width="2.5">
    <!-- A -> B (HTTP) -->
    <path d="M 1280 200 L 1210 200" marker-end="url(#arr)"/>
    <!-- B -> D -->
    <path d="M 900 270 L 900 322" marker-end="url(#arr)"/>
    <!-- D -> E -->
    <path d="M 750 470 L 750 512" marker-end="url(#arr)"/>
    <!-- D -> F (elbow) -->
    <path d="M 1200 440 L 1495 440 L 1495 512" marker-end="url(#arr)"/>
    <!-- C -> K -->
    <path d="M 290 270 L 290 722" marker-end="url(#arr)"/>
    <!-- K -> E (up) -->
    <path d="M 485 730 L 485 668" marker-end="url(#arr)"/>
    <!-- G -> E (elbow up) -->
    <path d="M 1250 805 L 1170 805 L 1170 668" marker-end="url(#arr)"/>
    <!-- G -> F (up) -->
    <path d="M 1495 730 L 1495 668" marker-end="url(#arr)"/>
    <!-- J -> B (right margin elbow) -->
    <path d="M 1740 1020 L 1775 1020 L 1775 110 L 900 110 L 900 122" marker-end="url(#arr)"/>
  </g>

  <g font-size="15" fill="#475569" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">
    <text x="1244" y="188" text-anchor="middle">HTTP 推理请求 :8800 / :8820</text>
    <text x="912" y="302" text-anchor="start">调用策略</text>
    <text x="762" y="498" text-anchor="start">查询未来帧 (dream)</text>
    <text x="1350" y="428" text-anchor="middle">梦境 → 动作</text>
    <text x="302" y="500" text-anchor="start">配置与启动</text>
    <text x="497" y="706" text-anchor="start">训练 / 评测</text>
    <text x="1182" y="740" text-anchor="start">训练数据</text>
    <text x="1507" y="706" text-anchor="start">训练数据</text>
    <text x="1330" y="100" text-anchor="middle">HTTP 客户端 (真机控制)</text>
  </g>

  <!-- ============ Row 1 : 入口层 ============ -->
  <!-- C: main.py (left) -->
  <rect x="60" y="130" width="460" height="140" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="290" y="168" text-anchor="middle" font-size="21" font-weight="bold" fill="#1E3A8A">vera/main.py — 训练入口</text>
  <text x="290" y="202" text-anchor="middle" font-size="15" fill="#1F2937">python -m vera.main (Hydra)</text>
  <text x="290" y="228" text-anchor="middle" font-size="15" fill="#1F2937">统一训练 IDM 与视频规划器</text>

  <!-- B: server (center) -->
  <rect x="600" y="130" width="600" height="140" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="900" y="168" text-anchor="middle" font-size="21" font-weight="bold" fill="#1E3A8A">vera/server — VERA 策略服务</text>
  <text x="900" y="202" text-anchor="middle" font-size="15" fill="#1F2937">start_vera_server · protocol · vis_server 实时可视化面板</text>
  <text x="900" y="228" text-anchor="middle" font-size="15" fill="#1F2937">按 embodiment 启动: pusht / mimicgen / droid / allegro</text>

  <!-- A: notebooks (right) -->
  <rect x="1280" y="130" width="460" height="140" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="1510" y="168" text-anchor="middle" font-size="21" font-weight="bold" fill="#1E3A8A">examples/ — 客户端 Notebook</text>
  <text x="1510" y="202" text-anchor="middle" font-size="15" fill="#1F2937">pusht_dfot_stack.ipynb</text>
  <text x="1510" y="228" text-anchor="middle" font-size="15" fill="#1F2937">mimicgen_stack.ipynb · droid_generation.ipynb</text>

  <!-- ============ Row 2 : 策略层 ============ -->
  <rect x="600" y="330" width="600" height="140" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
  <text x="900" y="368" text-anchor="middle" font-size="21" font-weight="bold" fill="#4C1D95">vera/policy — 两阶段闭环策略</text>
  <text x="900" y="402" text-anchor="middle" font-size="15" fill="#1F2937">motion_policy · world_models · 动作块与重规划</text>
  <text x="900" y="428" text-anchor="middle" font-size="15" fill="#1F2937">规划 3 帧未来 → 执行 2 步动作 (可配置)</text>
  <text x="900" y="454" text-anchor="middle" font-size="15" fill="#1F2937">自适应运动策略 · cartesian 支持 · 抓取器</text>

  <!-- ============ Row 3 : 模型层 ============ -->
  <rect x="450" y="520" width="740" height="140" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="820" y="558" text-anchor="middle" font-size="21" font-weight="bold" fill="#92400E">vera/video_model — 视频规划器 (世界模型)</text>
  <text x="820" y="592" text-anchor="middle" font-size="15" fill="#1F2937">DFoT 规划器 (PushT, ~39 MB)</text>
  <text x="820" y="618" text-anchor="middle" font-size="15" fill="#1F2937">WAN DiT 规划器 (MimicGen 1.3B · DROID 14B)</text>
  <text x="820" y="644" text-anchor="middle" font-size="15" fill="#1F2937">algorithms · link · utils</text>

  <rect x="1250" y="520" width="490" height="140" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="1495" y="558" text-anchor="middle" font-size="21" font-weight="bold" fill="#92400E">vera/idm — 雅可比逆动力学</text>
  <text x="1495" y="592" text-anchor="middle" font-size="15" fill="#1F2937">jacobian · inverse_dynamics</text>
  <text x="1495" y="618" text-anchor="middle" font-size="15" fill="#1F2937">骨干: VGGT-1B / DPT</text>
  <text x="1495" y="644" text-anchor="middle" font-size="15" fill="#1F2937">dfot · vae · wan · common</text>

  <!-- ============ Row 4 : 数据 / 训练 ============ -->
  <rect x="60" y="730" width="460" height="150" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
  <text x="290" y="768" text-anchor="middle" font-size="21" font-weight="bold" fill="#14532D">vera/experiments + configurations</text>
  <text x="290" y="802" text-anchor="middle" font-size="15" fill="#1F2937">base_exp · data_modules (可续训)</text>
  <text x="290" y="828" text-anchor="middle" font-size="15" fill="#1F2937">Hydra YAML 配置</text>
  <text x="290" y="854" text-anchor="middle" font-size="15" fill="#1F2937">含 5 环境混合训练 (OMNI)</text>

  <rect x="1250" y="730" width="490" height="150" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
  <text x="1495" y="768" text-anchor="middle" font-size="21" font-weight="bold" fill="#14532D">vera/datasets — 数据集</text>
  <text x="1495" y="802" text-anchor="middle" font-size="15" fill="#1F2937">video_dataset · idm_dataset · packed 布局</text>
  <text x="1495" y="828" text-anchor="middle" font-size="15" fill="#1F2937">帧采样 · 归一化 · registry / mixture</text>
  <text x="1495" y="854" text-anchor="middle" font-size="15" fill="#1F2937">打包: scripts/data/pack_pusht.py (JPEG帧+光流)</text>

  <!-- ============ Row 5 : 部署 / 评测 ============ -->
  <rect x="450" y="950" width="700" height="140" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="800" y="988" text-anchor="middle" font-size="21" font-weight="bold" fill="#0F172A">vera/env_runner — 仿真评测</text>
  <text x="800" y="1022" text-anchor="middle" font-size="15" fill="#1F2937">pusht · mimicgen · robomimic</text>
  <text x="800" y="1048" text-anchor="middle" font-size="15" fill="#1F2937">iiwa · allegro runner</text>
  <text x="800" y="1074" text-anchor="middle" font-size="15" fill="#1F2937">封装 gym-pusht / robosuite / mujoco 仿真环境</text>

  <rect x="1250" y="950" width="490" height="140" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="1495" y="988" text-anchor="middle" font-size="21" font-weight="bold" fill="#0F172A">vera/controller — 真机部署</text>
  <text x="1495" y="1022" text-anchor="middle" font-size="15" fill="#1F2937">run_controller · robot_iface</text>
  <text x="1495" y="1048" text-anchor="middle" font-size="15" fill="#1F2937">obs_builder · action_player</text>
  <text x="1495" y="1074" text-anchor="middle" font-size="15" fill="#1F2937">相机读取 · 动作回放 (DROID FR3 等)</text>
</svg>

</html>
